name: Platform CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r P1/requirements-api.txt
          pip install -r P1/requirements-train.txt

      - name: Run tests
        run: pytest P2/tests P1/tests -q

      - name: Validate Compose
        run: docker compose config --quiet

  kubernetes-dry-run:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.4"

      - name: Start Kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          node_image: kindest/node:v1.30.4

      - name: Validate Kubernetes manifests
        run: kubectl apply --dry-run=server -f k8s/platform.yaml

  docker:
    runs-on: ubuntu-latest
    needs:
      - test
      - kubernetes-dry-run
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build P1 API
        run: docker build -f P1/Dockerfile.api -t self-healing/p1-api:ci .

      - name: Build dashboard
        run: docker build -f P1/Dockerfile.dashboard -t self-healing/dashboard:ci .

      - name: Build P2 API
        run: docker build -f P2/Dockerfile -t self-healing/p2-api:ci .
