global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: p2-self-healing
    metrics_path: /metrics
    static_configs:
      - targets:
          - p2-api:8000

  - job_name: p2-self-healing-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - p2-worker:8002

  - job_name: p1-predictive-maintenance
    metrics_path: /metrics
    static_configs:
      - targets:
          - p1-api:8000
